syntax = "proto3";

package sqld.v1.ir;

import "sqld/v1/ir/common.proto";
import "sqld/v1/ir/type.proto";

option go_package = "github.com/yaroher/sqld/pkg/proto/sqld/v1/ir;irv1";

// ----------------------------------------------------------------------------
// Expressions
//
// `Expr` is the shared, recursive expression tree. It is reused everywhere an
// expression can appear: column defaults, CHECK constraints, generated columns,
// index expressions, view bodies, and all DML clauses.
//
// Per design fork 2(b), common shapes are structured; `raw_sql` is the escape
// hatch for any PG construct not yet modeled. It keeps the IR lossless.
// ----------------------------------------------------------------------------

message Expr {
  oneof node {
    Literal literal = 1;
    ColumnRef column_ref = 2;
    ParameterRef parameter = 3;
    FunctionCall function_call = 4;
    OperatorExpr operator = 5;
    CaseExpr case_expr = 6;
    CastExpr cast = 7;
    SubqueryExpr subquery = 8;
    ListExpr list = 9;      // (a, b, c) / row(...)
    StarExpr star = 10;     // * or t.*
    string raw_sql = 11;    // escape hatch
  }
  Metadata meta = 20;
  string node_id = 21; // stable host-assigned AST id; see AnnotationTargetRef
}

// Literal is a constant. Exactly one value field is set; `null_value = true`
// represents SQL NULL.
message Literal {
  oneof value {
    bool null_value = 1;
    int64 int_value = 2;
    double float_value = 3;
    string numeric_value = 4; // exact decimal carried as text
    string string_value = 5;
    bool bool_value = 6;
    bytes bytea_value = 7;
  }
  TypeRef type = 10; // declared/inferred type, when known
}

// ColumnRef references a column, optionally qualified by a table alias/name.
message ColumnRef {
  string qualifier = 1; // table alias or name; empty if unqualified
  string column = 2;
  ObjectRef target = 3; // resolved column, when known
}

// ParameterRef is a bind parameter: $1 (position) or :name / @name (name).
message ParameterRef {
  uint32 position = 1; // 1-based; 0 if named
  string name = 2;
}

// FunctionCall is a scalar/aggregate/window function invocation.
message FunctionCall {
  QualifiedName name = 1;
  ObjectRef target = 2;              // resolved function, when known
  repeated Expr arguments = 3;
  bool distinct = 4;                 // agg(DISTINCT ...)
  repeated OrderByItem order_by = 5; // agg WITHIN GROUP / ORDER BY
  Expr filter = 6;                   // FILTER (WHERE ...)
  WindowSpec over = 7;               // OVER (...) -> window function
  bool variadic = 8;
}

// OperatorExpr is any operator application: unary, binary, or logical
// (AND/OR/NOT). `symbol` is the operator token, e.g. "=", "+", "AND",
// "IS NULL", "@>", "LIKE".
message OperatorExpr {
  string symbol = 1;
  repeated Expr operands = 2;
}

message CaseWhen {
  Expr condition = 1;
  Expr result = 2;
}

// CaseExpr models simple and searched CASE. For simple CASE, `operand` is set
// and each `whens[i].condition` is the compared value.
message CaseExpr {
  Expr operand = 1;            // optional (searched CASE leaves it unset)
  repeated CaseWhen whens = 2;
  Expr else_result = 3;
}

// CastExpr is CAST(expr AS type) / expr::type.
message CastExpr {
  Expr expr = 1;
  TypeRef target_type = 2;
}

enum SubqueryKind {
  SUBQUERY_KIND_UNSPECIFIED = 0;
  SUBQUERY_KIND_SCALAR = 1; // (SELECT ...)
  SUBQUERY_KIND_EXISTS = 2; // EXISTS (SELECT ...)
  SUBQUERY_KIND_IN = 3;     // expr IN (SELECT ...)
  SUBQUERY_KIND_ANY = 4;    // expr op ANY (SELECT ...)
  SUBQUERY_KIND_ALL = 5;    // expr op ALL (SELECT ...)
}

// SubqueryExpr embeds a query inside an expression. `operand`/`symbol` are used
// by IN/ANY/ALL forms.
message SubqueryExpr {
  SubqueryKind kind = 1;
  SelectStmt query = 2;
  Expr operand = 3; // left-hand side for IN/ANY/ALL
  string symbol = 4; // comparison operator for ANY/ALL
}

// ListExpr is a parenthesized list / row constructor.
message ListExpr {
  repeated Expr elements = 1;
  bool is_row = 2; // true for ROW(...)
}

// StarExpr is `*` or `qualifier.*`.
message StarExpr {
  string qualifier = 1; // empty for bare *
}

// ----------------------------------------------------------------------------
// SELECT query tree
//
// `SelectStmt` and `Expr` are mutually recursive, so they share this file.
// Write statements (INSERT/UPDATE/DELETE) live in dml.proto and depend on this
// file one-directionally.
// ----------------------------------------------------------------------------

enum SortOrder {
  SORT_ORDER_UNSPECIFIED = 0;
  SORT_ORDER_ASC = 1;
  SORT_ORDER_DESC = 2;
}

enum NullsOrder {
  NULLS_ORDER_UNSPECIFIED = 0;
  NULLS_ORDER_FIRST = 1;
  NULLS_ORDER_LAST = 2;
}

message OrderByItem {
  Expr expr = 1;
  SortOrder order = 2;
  NullsOrder nulls = 3;
  string using_operator = 4; // ORDER BY ... USING op
  string node_id = 21;       // stable host-assigned AST id
}

// SelectTarget is one item in a select list or RETURNING list.
message SelectTarget {
  Expr expr = 1;
  string alias = 2; // AS alias; empty if none
  string node_id = 21; // stable host-assigned AST id
}

enum SetOpKind {
  SET_OP_KIND_UNSPECIFIED = 0;
  SET_OP_KIND_UNION = 1;
  SET_OP_KIND_INTERSECT = 2;
  SET_OP_KIND_EXCEPT = 3;
}

// SetOperation combines two queries (UNION / INTERSECT / EXCEPT).
message SetOperation {
  SetOpKind kind = 1;
  bool all = 2; // UNION ALL vs UNION
  SelectStmt left = 3;
  SelectStmt right = 4;
  string node_id = 21; // stable host-assigned AST id
}

// SimpleSelect is a single SELECT block (no set operation at this level).
message SimpleSelect {
  bool distinct = 1;
  repeated Expr distinct_on = 2; // DISTINCT ON (...)
  repeated SelectTarget targets = 3;
  repeated FromItem from = 4;
  Expr where = 5;
  repeated Expr group_by = 6;
  bool group_by_all = 7;     // GROUP BY ALL / DISTINCT variants -> see raw_sql
  Expr having = 8;
  repeated WindowDef windows = 9;
  string node_id = 21; // stable host-assigned AST id
}

enum CteMaterialization {
  CTE_MATERIALIZATION_UNSPECIFIED = 0; // default (planner decides)
  CTE_MATERIALIZATION_MATERIALIZED = 1;
  CTE_MATERIALIZATION_NOT_MATERIALIZED = 2;
}

// CommonTableExpr is one WITH entry. `query` may be a SelectStmt; non-SELECT
// CTEs fall back to raw_sql on the inner statement.
message CommonTableExpr {
  string name = 1;
  repeated string columns = 2;
  SelectStmt query = 3;
  CteMaterialization materialization = 4;
  string node_id = 21; // stable host-assigned AST id
}

enum LockStrength {
  LOCK_STRENGTH_UNSPECIFIED = 0;
  LOCK_STRENGTH_UPDATE = 1;        // FOR UPDATE
  LOCK_STRENGTH_NO_KEY_UPDATE = 2; // FOR NO KEY UPDATE
  LOCK_STRENGTH_SHARE = 3;         // FOR SHARE
  LOCK_STRENGTH_KEY_SHARE = 4;     // FOR KEY SHARE
}

enum LockWaitPolicy {
  LOCK_WAIT_POLICY_UNSPECIFIED = 0; // wait (default)
  LOCK_WAIT_POLICY_NOWAIT = 1;
  LOCK_WAIT_POLICY_SKIP_LOCKED = 2;
}

message LockingClause {
  LockStrength strength = 1;
  repeated ObjectRef of_tables = 2; // OF table, ...
  LockWaitPolicy wait = 3;
}

// SelectStmt is a complete query expression: optional CTEs, a body (a simple
// select, a set operation, or a VALUES list), and trailing ORDER/LIMIT/locking.
message SelectStmt {
  repeated CommonTableExpr with = 1;
  bool with_recursive = 2;

  oneof body {
    SimpleSelect select = 3;
    SetOperation set_operation = 4;
    Values values = 5;
  }

  repeated OrderByItem order_by = 6;
  Expr limit = 7;        // LIMIT count / FETCH FIRST
  Expr offset = 8;       // OFFSET
  LockingClause locking = 9;

  string raw_sql = 15;   // escape hatch for the whole statement
  Metadata meta = 16;
  string node_id = 21;   // stable host-assigned AST id
}

// ----------------------------------------------------------------------------
// FROM items
// ----------------------------------------------------------------------------

enum JoinType {
  JOIN_TYPE_UNSPECIFIED = 0;
  JOIN_TYPE_INNER = 1;
  JOIN_TYPE_LEFT = 2;
  JOIN_TYPE_RIGHT = 3;
  JOIN_TYPE_FULL = 4;
  JOIN_TYPE_CROSS = 5;
}

message TableRef {
  ObjectRef table = 1;
  QualifiedName name = 2; // carried even when unresolved
  string alias = 3;
  bool only = 4; // FROM ONLY t
}

message SubqueryRef {
  SelectStmt query = 1;
  string alias = 2;
  repeated string column_aliases = 3;
  bool lateral = 4;
}

message FunctionRef {
  Expr call = 1; // table function, e.g. unnest(...) / jsonb_to_recordset(...)
  string alias = 2;
  repeated string column_aliases = 3;
  bool lateral = 4;
  bool with_ordinality = 5;
}

message ValuesRef {
  Values values = 1;
  string alias = 2;
  repeated string column_aliases = 3;
}

message JoinClause {
  JoinType type = 1;
  FromItem left = 2;
  FromItem right = 3;
  Expr on = 4;                 // ON <condition>
  repeated string using = 5;   // USING (col, ...)
  bool natural = 6;            // NATURAL JOIN
  string node_id = 21;         // stable host-assigned AST id
}

message FromItem {
  oneof source {
    TableRef table = 1;
    SubqueryRef subquery = 2;
    JoinClause join = 3;
    FunctionRef function = 4;
    ValuesRef values = 5;
  }
  string node_id = 21; // stable host-assigned AST id
}

// ----------------------------------------------------------------------------
// VALUES + window definitions
// ----------------------------------------------------------------------------

message ValuesRow {
  repeated Expr values = 1;
}

message Values {
  repeated ValuesRow rows = 1;
}

// WindowSpec is an inline OVER (...) or a reference to a named window.
message WindowSpec {
  string ref_name = 1;             // OVER w (named window); empty if inline
  repeated Expr partition_by = 2;
  repeated OrderByItem order_by = 3;
  string frame = 4;                // raw frame clause, e.g. "ROWS BETWEEN ..."
}

// WindowDef is a named window in the WINDOW clause.
message WindowDef {
  string name = 1;
  WindowSpec spec = 2;
}
