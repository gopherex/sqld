syntax = "proto3";

package sqld.v1.config;

import "sqld/v1/ir/common.proto";

option go_package = "github.com/yaroher/sqld/pkg/proto/sqld/v1/config;configv1";

// ----------------------------------------------------------------------------
// Generation config. This is the user-facing document (serializable as
// textproto / JSON / YAML) that drives a generation run: which SQL and
// migrations to read, and which plugins to run with what settings.
// ----------------------------------------------------------------------------

// Config is the root of a generation run.
message Config {
  string version = 1;            // config schema version, e.g. "1"
  sqld.v1.ir.Engine engine = 2;     // dialect; ENGINE_POSTGRESQL
  repeated SqlSource sql = 3;        // schema (DDL) and/or query (DML) sources
  repeated MigrationSource migrations = 4;
  repeated PluginConfig plugins = 5;
  GlobalOptions options = 6;
}

enum SqlKind {
  SQL_KIND_UNSPECIFIED = 0;
  SQL_KIND_SCHEMA = 1; // DDL -> Catalog
  SQL_KIND_QUERY = 2;  // named DML queries -> Query
}

// SqlSource points at SQL input: a single file, a directory, or inline text.
message SqlSource {
  oneof source {
    string file = 1;   // path to one .sql file
    string dir = 2;    // directory of .sql files
    string inline = 3; // literal SQL
  }
  string glob = 4;       // pattern within `dir`; default "*.sql"
  bool recursive = 5;    // descend into subdirectories of `dir`
  SqlKind kind = 6;      // schema vs query
}

// MigrationSource points at a migrations directory. Always a folder; only the
// native (our own) migration format is supported for now. Third-party formats
// (goose, golang-migrate, dbmate, atlas, ...) come later.
message MigrationSource {
  string dir = 1;       // migrations directory
  string glob = 2;      // default "*.sql"
}

// PluginSource locates the plugin implementation. Exactly one of wasm/binary/
// command is set.
message PluginSource {
  oneof location {
    string wasm = 1;    // path to a .wasm module (host instantiates)
    string binary = 2;  // path to an executable (gRPC over stdio)
    string command = 3; // command resolved via PATH (gRPC over stdio)
  }
  string sha256 = 4;        // optional integrity check of the artifact
  repeated string args = 5; // extra args passed to binary/command
}

// PluginConfig declares one generator plugin and its settings for this run.
message PluginConfig {
  string name = 1;          // logical name, used in diagnostics
  PluginSource source = 2;
  string out = 3;           // output directory (relative to config file)
  // Plugin-specific settings. Opaque to the host: the plugin decodes these
  // bytes into its own options message (e.g. a serialized proto or raw JSON).
  bytes options = 4;
  bool enabled = 5;             // default true; set false to skip
  map<string, string> env = 6;  // env vars for process (binary/command) plugins
}

// GlobalOptions are host-level settings applied before plugins run.
message GlobalOptions {
  string default_schema = 1;     // usually "public"
  repeated string search_path = 2;
  // Global type overrides, e.g. "public.users.id" -> a canonical type name,
  // consumed by the host when building the Catalog.
  map<string, string> type_overrides = 3;
  bool strict = 4;               // fail the run on any parse/resolve warning
}
