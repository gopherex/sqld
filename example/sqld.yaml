version: "1"
engine: postgresql
options:
  defaultSchema: public
schema:
  - file: example/schema.sql
queries:
  - dir: example/queries
migrations:
  - dir: example/migrations
plugins:
  - name: go
    binary: ./bin/sqld-gen-go
    out: example/gen/db
    options:
      package: db
      overrides:
        "app.kitchen_sink.c_jsonb": map[string]any
        uuid: github.com/google/uuid.UUID
  - name: bob
    binary: ./bin/sqld-gen-bob
    out: example/gen/bob
    options:
      package: models
      typesPackage: github.com/yaroher/sqld/example/gen/db
      nullMode: pointer
      overrides:
        "app.kitchen_sink.c_jsonb": map[string]any
        uuid: github.com/google/uuid.UUID
